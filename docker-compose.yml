version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: roadrepair-db
    environment:
      POSTGRES_DB: roadrepair
      POSTGRES_USER: roadrepair
      POSTGRES_PASSWORD: roadrepair
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadrepair -d roadrepair"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
